name: Check limit order fills

# Manual-only: the backend runs on Vercel Services now, a warm process that ticks its own
# setInterval sweep (backend/src/server.ts) while a real visitor is keeping it alive, and costs
# nothing while idle. Kept here as a manual fallback for poking the sweep on demand.
on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger fill sweep
        run: |
          curl -sf -X POST "${{ secrets.PAPER_TRADER_API_URL }}/api/internal/check-fills" \
            -H "x-cron-secret: ${{ secrets.PAPER_TRADER_CRON_SECRET }}"
